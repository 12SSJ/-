name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project RebarCalculator.xcodeproj \
            -scheme RebarCalculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="ios/build/Build/Products/Release-iphoneos/RebarCalculator.app"
          test -d "$APP_PATH"
          rm -rf Payload RebarCalculator.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry RebarCalculator.ipa Payload
          echo "IPA 内容："
          unzip -l RebarCalculator.ipa | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebarCalculator-unsigned-ipa
          path: RebarCalculator.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RebarCalculator.ipa
